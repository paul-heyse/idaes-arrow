name: (util) Cleanup

on:
  pull_request_target:
    types: [labeled]

jobs:
  clean-labels:
    name: (util) Remove workflow trigger labels
    runs-on: ubuntu-latest
    # FORK: first conjunct disables this here -- it needs secrets.IDAES_BUILD_TOKEN,
    # which only exists upstream.
    if: >-
      github.repository == 'IDAES/idaes-pse'
      && contains(github.event.label.description, 'triggers_workflow')
    env:
      GITHUB_TOKEN: ${{ secrets.IDAES_BUILD_TOKEN }}
      pull_number: ${{ github.event.pull_request.number }}
      label_name: ${{ github.event.label.name }}
    steps:
      - name: Issue API call to remove label
        run:
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/$pull_number/labels/$label_name"
