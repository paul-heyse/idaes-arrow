# Type checking for idaes-arrow.
#
# Schema verified empirically against pyrefly 1.3.0 (`pyrefly init` +
# `pyrefly dump-config`, and a fixture proving [[sub-config]] suppression takes
# effect). Re-verify on any major version bump.

project-includes = ["idaes", "scripts", "rust/py/idaes-accel/python"]
project-excludes = [
  "**/docs-code-update/**", # vendored references + another workflow's corpus
  "**/rust/target/**",
  "**/.venv/**",
  "**/node_modules/**",
]

# The floor we claim in the classifiers, not the 3.14.7 we develop on: checking
# against the oldest supported interpreter is what catches accidental use of
# newer syntax or stdlib APIs.
python-version = "3.10"

# WITHOUT this pyrefly cannot resolve pyomo/numpy/pandas, and the errors it
# reports are then wrong rather than merely fewer.
python-interpreter = ".venv/bin/python"

# ---------------------------------------------------------------------------
# Upstream IDAES is Pyomo-metaprogrammed. `model.x[1]`, `model.c = Constraint(...)`
# and `blk.config.foo` are correct, idiomatic code that no type checker can
# follow, because the attributes are created at runtime by
# `declare_process_block_class()` and Pyomo's Component machinery.
#
# Measured on pyrefly 1.3.0 with the project interpreter: these five kinds are
# 45,207 of 48,522 errors. Reporting them is not a signal, it is a wall of noise
# that would make the baseline useless and churn on every pyrefly release.
#
# Disabled for `idaes/**` ONLY. `idaes/accel/**` is fork-authored and is matched
# by the second block below, which turns them back on -- our own code gets the
# full check, and its 9 errors get fixed rather than suppressed.
# ---------------------------------------------------------------------------
[[sub-config]]
matches = "idaes/**"

[sub-config.errors]
missing-attribute = false
unsupported-operation = false
bad-index = false
not-callable = false
missing-module-attribute = false

# Fork-authored code: everything on, no exceptions.
[[sub-config]]
matches = "idaes/accel/**"

[sub-config.errors]
missing-attribute = true
unsupported-operation = true
bad-index = true
not-callable = true
missing-module-attribute = true
