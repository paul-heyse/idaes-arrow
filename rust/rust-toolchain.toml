# Pinned stable. Nightly is never the default for this workspace: Miri,
# cargo-udeps and fuzz coverage invoke `cargo +nightly-<date> ...` explicitly so
# compiler-private checks can never silently change the compiler that builds the
# wheels shipped to users.
#
# This is the version everything is built and tested with, and it is also the
# declared MSRV in rust/Cargo.toml -- the two are kept equal on purpose. A
# declared floor below what CI exercises is a promise nothing verifies.
# (DataFusion 55's own floor is 1.94.0; we sit above it.)
[toolchain]
channel = "1.98.1"
profile = "minimal"
components = ["rustfmt", "clippy", "rust-analyzer", "rust-src", "llvm-tools"]
