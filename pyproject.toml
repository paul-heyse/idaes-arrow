[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idaes-pse"
description = "IDAES Process Systems Engineering Framework"
readme = { file = "README.md", content-type = "text/markdown" }
maintainers = [{ name = "Keith Beattie", email = "ksbeattie@lbl.gov" }]
license = { text = "BSD" }
urls = { Homepage = "https://idaes.org" }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
  "IDAES",
  "idaes-pse",
  "energy systems",
  "chemical engineering",
  "process modeling",
]
# Minimum python version is not set since legacy projects or other edge cases may use or rely unsupported versions. 
# We will rely on classifiers and documentation to communicate supported versions.
# requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "pyomo >= 6.10.1",
  "pint >= 0.24.1",   # required to use Pyomo units. Pint 0.24.1 needed for Python 3.9 support,
  "networkx", # required to use Pyomo network
  "numpy>=1,<3",
  "pandas != 2.1.0", # pandas constraint added on 2023-08-30 b/c bug in v2.1. See IDAES/idaes-pse#1253
  "scipy",
  "sympy",            # idaes.core.util.expr_doc
  "matplotlib",
  "click>=8",
  "pydantic",         # used by core.util.structfs, at a minimum
]

[project.optional-dependencies]
ui = ["idaes-ui", "idaes-connectivity"]
coolprop = [
  "coolprop>=8.0", # idaes.generic_models.properties.general.coolprop
]
grid = [
  "gridx-prescient>=2.2.3", # idaes.tests.prescient
]
omlt = [
  "omlt==1.1",  # fix the version for now as package evolves
  # TODO: Remove the marker when TensorFlow publishes Python 3.14 distributions.
  "tensorflow; python_version < '3.14'",
  "onnx",
]
testing = ["pytest", "addheader", "pyyaml"]
# FORK: the optional Rust acceleration wheel. Deliberately NOT in
# requirements-dev.txt -- that file is installed on Read the Docs and on every
# cell of the core.yml matrix, none of which have a Rust toolchain.
accel = ["idaes-accel"]

# this will install all optional dependencies
all = ["idaes-pse[ui,grid,omlt,coolprop]"]

# FORK: quality tooling, pinned exactly.
#
# PEP 735 dependency groups rather than an extra: these never belong in the
# published wheel's metadata, and Read the Docs (which installs via
# requirements-dev.txt) must not drag them in.
#
# Exact pins, not floors, and for a specific reason. A formatter that drifts
# produces phantom diffs -- this repo already hit that when a local black
# 25.9.0 disagreed with the repo-pinned 26.3.1 -- and a type checker that
# drifts churns the suppression baselines. Bumping is a deliberate commit that
# re-runs `just baseline-update`.
#
# Install with:  uv pip install --group quality
[dependency-groups]
quality = [
  "ruff==0.16.7",
  "pyrefly==1.3.0",
]
# Building the optional Rust extension in-place (`just accel-develop`).
accel = [
  "maturin>=1.15,<2.0",
]
dev = [
  { include-group = "quality" },
  { include-group = "accel" },
]

[tool.ruff]
# FORK: ruff replaces black (format), flake8 and pylint (lint). One tool, one
# pass, pinned exactly in [dependency-groups].quality so CI and every developer
# agree. Resolve it from .venv, never $PATH.
target-version = "py310"   # the floor the classifiers claim, not the 3.14 we develop on
line-length = 88           # carried over from the flake8 config it replaces
extend-exclude = [
  # Vendored third-party API references and a separate workflow's document
  # corpus. Not IDAES source; see FORK.md.
  "docs-code-update",
  ".codex",
  ".agents",
  "rust/target",
]

[tool.ruff.lint]
# Ruff 0.16's defaults are already broad. This makes the selection explicit so a
# ruff upgrade cannot silently change what the gate means.
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "B",         # bugbear
  "C4",        # comprehensions
  "UP",        # pyupgrade
  "SIM",       # simplify
  "RUF",       # ruff-specific
  "PT",        # pytest style
  "PERF",      # performance
  "N",         # naming
  "ARG",       # unused arguments
  "PTH",       # pathlib
  "TRY",       # exception handling
]
# Existing violations are recorded in .quality/ruff-baseline.json rather than
# ignored, so they stay visible and can only ratchet down.
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests legitimately assert on private state and reuse fixture names.
"**/tests/**" = ["ARG001", "ARG002", "PT011"]

[tool.ruff.lint.isort]
known-first-party = ["idaes", "idaes_accel"]

[tool.ruff.format]
docstring-code-format = true

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
tag_regex = '^(?P<version>\d+\.\d+\.\d+(?:\.dev\d+|a\d+|b\d+|rc\d+)?)$'

[tool.setuptools]
zip-safe = false
include-package-data = true


[tool.setuptools.packages.find]
# FORK: was ["idaes*"], which also matches `idaes_accel` (the separate
# maturin-built distribution). Anchored so the two can never collide.
include = ["idaes", "idaes.*"]

[tool.setuptools.package-data]
"*" = [
  "*.template",
  "*.json",
  "*.yaml",
  "*.svg",
  "*.png",
  "*.jpg",
  "*.csv",
  "*.ipynb",
  "*.txt",
  "*.js",
  "*.css",
  "*.html",
  "*.json.gz",
  "*.dat",
  "*.h5",
  "*.pb",                  # for Keras Surrogate folder
  "*.data-00000-of-00001", # for Keras Surrogate folder
  "*.index",               # for Keras Surrogate folder
  "*.trc",
  "*.nl",
  "*.keras",               # idaes/core/surrogate/tests/data/keras_models
  "*.onnx",
]

[project.scripts]
idaes = "idaes.commands.base:command_base"
idaes-run = "idaes.commands.run_flowsheet:main"

[project.entry-points."idaes.flowsheets"]
"0D_Fixed_Bed_TSA" = "idaes.models_extra.temperature_swing_adsorption.fixed_bed_tsa0d_ui"
